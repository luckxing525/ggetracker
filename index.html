<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GGE Outreach Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: the printed toolkit, made clickable. Pick a situation -> a guide page (band, step number, WHEN/WHO, to-dos, templates). Tracker is one tab. Single light theme, matching the PDFs. */
:root{
  --plum:#6B1A45; --ink:#2A2230; --muted:#6E6573; --line:#E6DDE2; --paper:#FFFFFF; --bg:#FAF7F8;
  --teal:#2A9D8F; --teal-soft:#BEE1DD; --coral:#E9806E; --pink-soft:#F7D3CA; --yellow:#F4C542; --yellow-soft:#FFF1BC; --lilac-soft:#EAD0E8; --mauve-soft:#E2D3DC;
  --hl:#FAD9CF;
  --display:"Barlow Condensed","Arial Narrow",sans-serif; --body:"Barlow","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body)}
h1,h2,h3{font-family:var(--display);color:var(--plum);text-transform:uppercase;margin:0;line-height:1.02;text-wrap:balance;letter-spacing:.01em}
h1{font-size:46px;font-weight:800}
h2{font-size:26px;font-weight:800}
h3{font-size:19px;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:#fff;color:var(--ink);color-scheme:light}
input::placeholder,textarea::placeholder{color:#9A929E}
:focus-visible{outline:2px solid var(--plum);outline-offset:2px}
a{color:var(--plum)}
.top{display:flex;align-items:center;gap:16px;padding:14px 24px;background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;flex-wrap:wrap}
.stripe{height:6px;background:linear-gradient(90deg,var(--teal) 0 25%,var(--yellow) 25% 50%,var(--coral) 50% 75%,#B784B2 75%)}
.logo{font-family:var(--display);font-weight:800;color:var(--plum);font-size:20px;text-transform:uppercase;letter-spacing:.02em;display:flex;align-items:center;gap:10px}
.logo span{width:4px;height:22px;background:var(--teal);border-radius:2px}
.tabs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.tabs a{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:16px;letter-spacing:.03em;text-decoration:none;color:var(--muted);padding:6px 14px;border-radius:20px}
.tabs a.on{background:var(--plum);color:#fff}
.tabs a:hover:not(.on){color:var(--plum);background:var(--bg)}
.wrap{max-width:1080px;margin:0 auto;padding:28px 24px 80px;display:flex;flex-direction:column;gap:26px}
.band{border-radius:18px;padding:28px 32px;position:relative;overflow:hidden}
.band .eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--plum);margin-bottom:6px}
.band .lead{max-width:60ch;margin-top:10px;font-size:17px}
.band .big{position:absolute;right:26px;top:6px;font-family:var(--display);font-weight:800;font-size:150px;line-height:1;opacity:.35;color:#fff;pointer-events:none}
.pills{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.pill{background:#fff;border-radius:20px;padding:4px 12px;font-size:14px;font-weight:600;box-shadow:0 1px 0 rgba(0,0,0,.04)}
.pill b{font-size:11px;letter-spacing:.12em;color:var(--muted);margin-right:6px}
.c-teal{background:var(--teal-soft)} .c-pink{background:var(--pink-soft)} .c-yellow{background:var(--yellow-soft)} .c-lilac{background:var(--lilac-soft)} .c-mauve{background:var(--mauve-soft)}
.grouphead{display:flex;align-items:baseline;gap:12px;margin-bottom:12px}
.grouphead .n{font-family:var(--display);font-weight:800;color:var(--plum);font-size:15px;border:2px solid var(--plum);border-radius:50%;width:30px;height:30px;display:grid;place-items:center;flex:none}
.sits{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.sit{text-align:left;border:none;border-radius:14px;padding:16px 18px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:104px;transition:transform .12s, box-shadow .12s}
.sit:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(107,26,69,.12)}
.sit .t{font-family:var(--display);font-weight:700;font-size:22px;color:var(--plum);text-transform:uppercase;line-height:1.05}
.sit .d{font-size:14px;color:var(--ink);opacity:.8}
.sit .tag{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--plum);opacity:.7}
.back{align-self:flex-start;background:none;border:none;color:var(--plum);font-weight:600;cursor:pointer;padding:0;font-size:15px}
.choices{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.choices .q{font-weight:700;margin-right:6px}
.chip{border:2px solid var(--plum);background:#fff;color:var(--plum);border-radius:22px;padding:5px 14px;font-weight:600;cursor:pointer;font-size:15px}
.chip.on{background:var(--plum);color:#fff}
.toggle{display:inline-flex;gap:8px;align-items:center;font-weight:600;cursor:pointer;font-size:15px}
.toggle input{width:18px;height:18px;accent-color:var(--plum)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.7fr);gap:22px;align-items:start}
.panel{background:var(--paper);border-radius:14px;padding:20px;border:1px solid var(--line)}
.panel h3{margin-bottom:12px}
.todo label{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.todo label:last-child{border-bottom:none}
.todo input{width:18px;height:18px;margin-top:2px;accent-color:var(--teal);flex:none}
.todo .when{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--teal)}
.todo input:checked + span{opacity:.5;text-decoration:line-through}
.writing{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.writing b{font-family:var(--display);text-transform:uppercase;color:var(--plum);font-size:17px;margin-right:4px}
.writing input{border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-width:180px;flex:1}
.writing .hint{font-size:13px;color:var(--muted);flex-basis:100%}
.tpls{display:flex;flex-direction:column;gap:14px}
.tpl{background:var(--paper);border:2px dashed #D9C7D1;border-radius:14px;padding:16px 18px}
.tpl .h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.code{font-family:var(--display);font-weight:700;font-size:14px;color:#fff;background:var(--teal);border-radius:6px;padding:1px 8px;letter-spacing:.04em}
.code.c2{background:var(--coral)} .code.c3{background:var(--plum)}
.tpl .h h3{font-size:18px;margin-right:auto}
.copy{background:var(--yellow);border:none;border-radius:16px;font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.08em;padding:3px 12px;cursor:pointer;color:var(--ink)}
.copy:hover{filter:brightness(.95)}
.copy.ghost{background:var(--yellow-soft)}
.tpl .body{white-space:pre-wrap;font-size:15.5px;line-height:1.65}
.tpl .subj{display:block;font-weight:700;margin-bottom:8px}
.hl{background:var(--hl);border-radius:3px;padding:1px 3px;outline:none;border-bottom:2px solid transparent;cursor:text;min-width:2ch;display:inline}
.hl:empty::before{content:attr(data-f);color:#9B5B66;font-style:italic}
.hl.opt:empty{background:transparent;border:1px dashed #D9C7D1}
.hl:focus{border-bottom-color:var(--plum);background:#FCE7E0}
.hl.filled{background:#E6F2EF;color:var(--ink)}
.tpl .note{font-size:13.5px;color:var(--muted);margin-top:10px}
.tip{font-size:13px;color:var(--muted)}
.sec{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sec .num{width:28px;height:28px;border-radius:50%;background:var(--plum);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:16px;flex:none}
.sec h2{font-size:22px}
.ttabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.ttab{border:2px solid var(--line);background:#fff;border-radius:12px;padding:6px 12px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:1px}
.ttab b{font-family:var(--display);text-transform:uppercase;color:var(--plum);font-size:16px;font-weight:700}
.ttab span{font-size:12px;color:var(--muted);font-weight:600}
.ttab.on{border-color:var(--plum);background:var(--pink-soft)}
.left{font-size:13px;font-weight:700;color:#9A2F21;margin:-4px 0 8px}
.left.ok{color:#1F6E59}
.hl.flash{animation:flash .9s ease 2}
@keyframes flash{50%{background:#F4B8A8}}
.link{font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.link.on{color:#1F6E59}
.link.off{color:var(--muted)}
.addtr{background:var(--teal);color:#fff;border:none;border-radius:20px;padding:5px 12px;font-weight:600;cursor:pointer}
.notes{list-style:none;margin:0;padding:0}
.notes li{padding:8px 0;border-bottom:1px solid var(--line)}
.notes li:last-child{border-bottom:none}
.notes .when{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--teal)}
.donebar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--paper);border:2px solid var(--plum);border-radius:16px;padding:16px 20px}
.donebar.is{border-color:#1F6E59;background:#EAF5F1}
.bigcheck{display:inline-flex;align-items:center;gap:12px;background:var(--plum);color:#fff;border:none;border-radius:14px;padding:12px 20px;font-family:var(--display);font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.02em;cursor:pointer}
.bigcheck .box{width:26px;height:26px;border-radius:7px;border:3px solid #fff;display:grid;place-items:center;font-size:18px;line-height:1}
.donebar.is .bigcheck{background:#1F6E59}
.donebar .msg{font-size:15px;flex:1;min-width:220px}
.kpis{display:flex;flex-direction:column;gap:14px}
.funnel{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.fstep{position:relative;padding:16px 26px 16px 22px;clip-path:polygon(0 0,calc(100% - 16px) 0,100% 50%,calc(100% - 16px) 100%,0 100%,16px 50%);background:var(--mauve-soft)}
.fstep:first-child{clip-path:polygon(0 0,calc(100% - 16px) 0,100% 50%,calc(100% - 16px) 100%,0 100%);padding-left:18px}
.fstep.goal{background:var(--teal-soft)}
.fstep .v{font-family:var(--display);font-weight:800;font-size:34px;color:var(--plum);line-height:1}
.fstep .v small{font-size:17px;font-weight:700;margin-left:4px}
.fstep .k{font-size:13px;margin-top:4px}
.fstep .tgt{font-size:12px;font-weight:700;color:var(--muted);margin-top:6px;letter-spacing:.02em}
.chans{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.chan{background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--plum);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.chan h3{font-size:19px;margin:0}
.chan .ex{font-size:13px;color:var(--muted);margin-top:-4px}
.chan .row2{display:flex;justify-content:space-between;align-items:baseline;font-size:14px}
.chan .row2 b{font-family:var(--display);font-size:26px;color:var(--plum)}
.bar{height:10px;background:#EEE6EA;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);border-radius:6px}
.bar.s i{background:var(--coral)}
.chan .via{font-size:13px;border-top:1px dashed var(--line);padding-top:6px}
.pace{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:14px}
.pace b{font-family:var(--display);font-size:20px;color:var(--plum)}
.chsel{border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-width:180px}
@media (max-width:820px){.funnel,.chans{grid-template-columns:1fr 1fr}}
.prog{font-size:12px;color:var(--muted);margin-top:3px;padding-left:7px}
.resetall{background:none;border:1px solid var(--line);border-radius:20px;padding:5px 12px;cursor:pointer;color:var(--muted);font-weight:600;font-size:14px}
.resetall:hover{color:var(--plum);border-color:var(--plum)}
.next{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.next .lbl{font-family:var(--display);text-transform:uppercase;font-weight:700;color:var(--plum);font-size:17px}
.nextbtn{border:none;border-radius:20px;padding:6px 14px;cursor:pointer;font-weight:600}
.callout{background:var(--teal-soft);border-radius:12px;padding:14px 18px;display:flex;gap:12px;align-items:flex-start}
.callout b{font-family:var(--display);text-transform:uppercase;color:var(--plum);font-size:17px}
table{width:100%;border-collapse:collapse;font-size:15px}
th{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--teal);text-align:left;padding:10px 14px;border-bottom:2px solid var(--line);font-weight:700}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.go{cursor:pointer} tr.go:hover td{background:var(--bg)}
.tablewrap{overflow-x:auto;background:var(--paper);border-radius:14px;border:1px solid var(--line)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat .v{font-family:var(--display);font-weight:800;font-size:30px;text-transform:uppercase}
.stat .k{font-size:14px;color:var(--muted)}
.recap input{width:100%;border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:14px}
.recap td{padding:6px 8px}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.metrics label{font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.tr input,.tr select{width:100%;border:1px solid transparent;background:#fff;border-radius:6px;padding:5px 7px;font-size:15px;min-width:110px}
.tr input:hover,.tr select:hover{border-color:var(--line)}
.tr input:focus,.tr select:focus{border-color:var(--plum);background:#fff;outline:none}
.warm{font-size:12px;font-weight:700;border-radius:12px;padding:2px 9px;white-space:nowrap}
.warm.ok{background:#E2F2EC;color:#1F6E59} .warm.mid{background:var(--yellow-soft);color:#7A5A00} .warm.cold{background:var(--pink-soft);color:#9A2F21}
.btn{background:var(--plum);color:#fff;border:none;border-radius:20px;padding:7px 16px;font-weight:600;cursor:pointer}
.btn.light{background:#fff;color:var(--plum);border:2px solid var(--plum)}
.x{background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;padding:4px 8px}
.x:hover{color:#9A2F21}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--plum);color:#fff;padding:9px 18px;border-radius:20px;font-weight:600;z-index:50}
.foot{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
@media (max-width:820px){
  .cols{grid-template-columns:1fr}
  h1{font-size:36px}
  .band{padding:22px 20px}
  .band .big{font-size:96px}
  .stats,.metrics{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion:reduce){.sit{transition:none}}
</style>
</head>
<body>
<div class="stripe"></div>
<header class="top"><div class="logo"><span></span>GGE Outreach Guide</div><nav class="tabs" id="tabs"></nav><button class="resetall" data-reset title="Clear the company, names and every blank you typed">↺ Reset</button><button class="resetall" data-signout title="Sign out on this device">Sign out</button></header>
<main class="wrap" id="main"></main>
<div class="toast" id="toast" hidden></div>
<textarea id="clip" aria-hidden="true" tabindex="-1" style="position:fixed;left:-9999px;opacity:0"></textarea>
<script>
"use strict";
/* ---------- Templates (from the toolkit PDFs) ---------- */
const TPL={
 T1:{t:"After a gift",s:"Thank you, [Name]!",b:"Hi [Name],\n\nThank you so much for [Company]’s [gift]! It’s going straight to [use], and our young people are so excited.\n\nI’ll send you an update by [update date].\n\nThank you again, [Your name]"},
 T2:{t:"After an event",s:"Thank you for joining us at [event]!",b:"Hi [Name],\n\nThank you to you and the [Company] team for coming to [event]! [One thing that happened]. I’ve attached a few photos.\n\nHope to see you at [next event]!\n\nBest, [Your name]"},
 T3:{t:"After they donate items",s:"Your [items] made it to our youth!",b:"Hi [Name],\n\nYour [items] arrived, and they’re already with young people in [program]. Thank you so much for thinking of us!\n\nThanks again, [Your name]"},
 T4:{t:"Handwritten card",c:3,b:"Dear [Name],\n\nThank you for being with us in our 25th year. Because of [Company], [result]. We’re so grateful.\n\nJoanne",n:"Joanne writes this by hand, along with her thank-you call."},
 T5:{t:"Social post",b:"Thank you, [@Company], for [what they did]! Because of you, [result].",n:"*Attach images of in-kind donations, event snapshots, photos of impact."},
 G1:{t:"Receipt for a cash gift",c:2,b:"Dear [Name],\n\nThank you for [Company]’s gift of $[amount] to Girls for Gender Equity on [gift date]. GGE is a 501(c)(3) nonprofit, EIN [EIN]. No goods or services were provided in exchange for this gift.\n\n[Joanne’s signature]",alt:1},
 G2:{t:"Receipt for donated items",c:2,b:"Dear [Name],\n\nThank you for [Company]’s donation of [items] to Girls for Gender Equity on [gift date]. GGE is a 501(c)(3) nonprofit, EIN [EIN]. No goods or services were provided in exchange for this gift.\n\n[Joanne’s signature]",alt:1,n:"Describe the items only. No dollar value."},
 U0:{t:"Ask staff for a story",b:"Hi [staff name]! I’m sending [Company] an update this week. Do you have a quick story or quote from [program] I could share (with the young person’s OK)? A photo would be great too. Thanks!",n:"Send this to program staff first, a few days before the update."},
 U1:{t:"Update email",s:"An update from GGE",b:"Hi [Name],\n\nI wanted to share what [Company]’s support has done so far: [number].\n\n[story]. I’ve attached a photo from [event]. It has truly been unbelievably inspiring what you’ve empowered them to do.\n\nNext up is [next event, date]. We’d love to see you there!\n\nBest, [Your name]"},
 U2:{t:"Short version",s:"Quick GGE update",b:"Hi [Name], quick update: thanks to [Company], [number]. Next up is [next event, date]. Thank you!\n\n[Your name]"},
 E1:{t:"Ask for their logo",s:"Your logo for [event]",b:"Hi [Name],\n\nSo excited to have [Company] at [event] on [event date]! Could you send your logo (PNG or SVG) and how you’d like your name to appear? I’ll send our social post for your OK by [post OK date].\n\nThanks! [Your name]"},
 E2:{t:"Say it on stage",c:3,b:"A big thank-you to [Company], who [what they did]. Because of them, [result]. Let’s give them a hand!",n:"Read this out loud on the day."},
 E3:{t:"Social post",b:"Thank you, [@Company], for [what they did] at [event]!",n:"Attach a photo, and get their OK on the post first."},
 ER1:{t:"Recap email",c:2,s:"Your recap from [event]",b:"Hi [Name],\n\nThank you again for being part of [event]! I’ve attached a one-page recap of everything [Company] was part of, with photos.\n\nA few highlights: [attendance], [one moment]. [If anything fell short: what happened and how we’ll make it right.]\n\nWe’re already planning [next event], and I’d love to talk about how [Company] could be part of it.\n\nBest, [Your name]"},
 R0:{t:"Year-end report outline (for Google Docs)",c:3,b:"[Company] + Girls for Gender Equity: Our 25th Year\n\n1. One-line headline: [main result, with one number]\n2. A note from Joanne: [2–3 sentences]\n3. By the numbers: [$ given] · [youth reached] · [volunteer hours]\n4. Photos and one youth quote: [quote, with their OK]\n5. Next year: [1–2 plans for 2028] · Ways to stay involved: [option 1] · [option 2]",n:"Paste into a Google Doc, add photos, and attach it to R1."},
 R1:{t:"Renewal email",s:"Thank you + 2028",b:"Hi [Name],\n\nThank you for such a great 25th year! I’ve attached a short report on what [Company] helped make happen, like [one highlight].\n\nWe’re starting to plan 2028 and would love to keep working together, maybe through [option 1] or [option 2]. Could we find 20 minutes in the next few weeks?\n\nBest, [Your name]"},
 R2:{t:"On the call",c:3,b:"Start: “Thanks again for this year. What worked well for your team?”\n\nSuggest: “Here are two ways we could keep going: [option 1] or [option 2].”\n\nWrap up: “What sounds right for 2028? I’ll send it in writing by [date].”"},
 R3:{t:"If they say no",c:2,s:"Thank you, [Name]",b:"Hi [Name],\n\nTotally understand, and thank you for everything this year. Would you be open to a quick 10-minute call so we can learn what would make GGE a better fit next time? We’d love to keep you on our updates list in the meantime.\n\nBest, [Your name]"},
 A:{t:"Past supporter",s:"Thank you, and an idea for our 25th",b:"Hi [Name],\n\nWe’d like to thank [Company] for backing Girls for Gender Equity in [year]. We’re super proud to share that your gift helped us [result], and we look to continue building our strong partnership!\n\nWe turn 25 this year and are planning a few big moments, like our Pride float in June. I think [Company] could be a great fit for [specific ask].\n\nWould you be open to a short 15-minute call in the next couple of weeks? I’ve attached a short overview.\n\nThanks,\n[Your name]",n:"For: Bobbi Brown / Estée Lauder · Youth to the People / L’Oréal · P&G · Saks · Eileen Fisher · Aerie"},

 return '<section class="panel recap"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px"><h3 style="margin:0">The one-page recap</h3><button class="copy" data-copyrecap>COPY RECAP</button></div><p class="tip" style="margin:0 0 10px">What we promised, what we delivered, and the proof. Use the last row for anything that fell short, and how we’ll make it right.</p>'+
 '<div class="tablewrap" style="border:none"><table><thead><tr><th>We promised</th><th>We delivered</th><th>Proof</th></tr></thead><tbody>'+r.rows.map((row,i)=>'<tr>'+row.map((c,j)=>'<td><input type="text" data-rc="'+i+'" data-j="'+j+'" value="'+esc(c.trim())+'" placeholder="'+(j===0?(i===r.rows.length-1?"Anything that fell short":"Promise"):j===1?"What happened":"photo / link")+'"></td>').join("")+'</tr>').join("")+'</tbody></table></div>'+

function viewTimeline(){
 return '<section class="band c-teal"><div class="eyebrow">Sponsor engagement timeline</div><h1>When and what to send</h1><div class="lead">After securing a partnership, standardized steps should be taken to make the partner feel seen and foster a long-term relationship.</div><div class="pills"><span class="pill"><b>WHEN</b>The day they say yes</span><span class="pill"><b>WHO</b>Outreach lead</span></div><div class="big" aria-hidden="true">01</div></section>'+

function firstName(c){c=String(c||"").trim();if(!c)return "";let t=c.split(/[\s,<(\/]+/)[0];if(t.includes("@")){t=t.split("@")[0].split(/[._]/)[0];t=t.charAt(0).toUpperCase()+t.slice(1)}return t}

/* ---------- Router ---------- */
const route=()=>(location.hash||"#home").slice(1)||"home";
function render(){const r=route();tabs(r);const m=document.getElementById("main");
 m.innerHTML=r==="timeline"?viewTimeline():r==="tracker"?viewTracker():r.startsWith("s-")?viewSit(r.slice(2)):viewHome();updateLeft()}

/* ---------- Copy ---------- */

 if(t.dataset.tab!==undefined){const k=route().slice(2),n=+t.dataset.tab;S.tab[k]=n;document.querySelectorAll(".ttab").forEach((x,i)=>{x.classList.toggle("on",i===n);x.setAttribute("aria-selected",i===n)});document.querySelectorAll(".tpls .tpl").forEach((c,i)=>c.hidden=i!==n);return}
 if(t.hasAttribute("data-reset")){S.vals={};S.recap=null;S.big=false;S.alt=false;S.pick={};S.tab={};
  try{Object.keys(localStorage).filter(x=>x.startsWith("gge.todo.")||x==="gge.vals"||x==="gge.recap").forEach(x=>localStorage.removeItem(x))}catch(err){}

  return}
 if(t.hasAttribute("data-copyrecap")){const r=recapRows();copy((S.vals.Company?S.vals.Company+" at "+(S.vals.event||"[event]")+": recap\n\n":"")+"WE PROMISED → WE DELIVERED (PROOF)\n"+r.rows.filter(x=>x[0].trim()).map(x=>"• "+x[0].trim()+" → "+(x[1].trim()||"—")+(x[2].trim()?" ("+x[2].trim()+")":"")).join("\n")+"\n\n"+Object.entries(r.m).map(([k,v])=>k+": "+(v||"–")).join(" · "));return}
 if(t.hasAttribute("data-add")){addRow();return}
 if(t.dataset.del){delRow(t.dataset.del);return}
 if(t.dataset.open){if(t.dataset.co)S.vals.Company=t.dataset.co;if(t.dataset.ct)S.vals.Name=t.dataset.ct.split(/[\s@,]/)[0];saveVals();location.hash="s-"+t.dataset.open;return}
});
document.addEventListener("input",e=>{

 if(t.classList&&t.classList.contains("hl")){const f=t.dataset.f;S.vals[f]=t.textContent;saveVals();

 if(t.dataset.rc!==undefined){const r=recapRows();r.rows[+t.dataset.rc][+t.dataset.j]=t.value;S.recap=r;ls.set("gge.recap",r);return}

 const t=e.target;
 if(t.hasAttribute("data-big")){S.big=t.checked;render();return}
 if(t.hasAttribute("data-alt")){S.alt=t.checked;render();return}
 if(t.dataset.v==="Company"){refreshLink();return}
 if(t.hasAttribute("data-ch")){const r=linkedRow();if(r){r.channel=t.value;saveRow(r);toast("Channel saved for "+r.company)}else{S.vals._ch=t.value;saveVals()}return}
 const tr=t.closest("tr[data-row]");if(tr&&t.dataset.k){const r=S.rows[tr.dataset.row];if(!r)return;r[t.dataset.k]=t.value;if(t.dataset.k==="stage"&&!r.last)r.last=today();saveRow(r);if(t.dataset.k==="stage"||t.dataset.k==="last"||t.dataset.k==="channel")render();else refreshKpis()}

/* ---------- Tracker storage: talks to /api/rows on Vercel ----------
   The page never touches the database directly. It sends the team password
   to the API with every request, and the API (api/rows.js) checks it before
   reading or writing Upstash Redis. */
const API="/api/rows";
let PW=ls.get("gge.pw","");
async function api(method,body,query){
 const res=await fetch(API+(query||""),{method,headers:{"content-type":"application/json","x-team-password":PW},body:body?JSON.stringify(body):undefined});
 if(res.status===401){showLogin("That password didn’t work. Ask your team lead for the current one.");throw new Error("unauthorized")}
 if(!res.ok){let msg="";try{msg=(await res.json()).error||""}catch(x){}
  if(res.status===404)msg="The site can’t find /api/rows. Check the api folder (with rows.js inside) is in your GitHub repo, then Redeploy.";
  throw new Error(msg||("Server error "+res.status))}
 return res.json();
}
const clean=r=>{const o=Object.assign({},r);delete o._t;return o};
const busy={},again={};
async function saveRow(r){
 r.updated=Date.now();
 if(S.mode==="local"){ls.set("gge.rows",JSON.parse(JSON.stringify(S.rows,(k,v)=>k==="_t"?undefined:v)));refreshKpis&&refreshKpis();return}
 if(busy[r.id]){again[r.id]=true;return}busy[r.id]=true;
 try{do{again[r.id]=false;await api("PUT",{row:clean(S.rows[r.id]||r)})}while(again[r.id])}
 catch(e){if(e.message!=="unauthorized")toast("Couldn’t save. Check your connection and try again")}
 finally{busy[r.id]=false}
}
function addRow(pre,quiet){const id=Math.random().toString(36).slice(2,10);const r=Object.assign({id,company:"",contact:"",stage:"first",last:today(),notes:"",steps:{},lastAction:"",channel:"",created:Date.now()},pre||{});S.rows[id]=r;saveRow(r);if(quiet)return;render();setTimeout(()=>{const el=document.querySelector('tr[data-row="'+id+'"] input');if(el)el.focus()},30)}
const deleted={};
async function delRow(id){delete S.rows[id];deleted[id]=Date.now();render();
 if(S.mode==="local"){ls.set("gge.rows",S.rows);return}
 try{await api("DELETE",null,"?id="+encodeURIComponent(id))}catch(e){if(e.message!=="unauthorized")toast("Couldn’t remove. Try again")}}
/* Merge what the server has with what's on screen: keep whichever copy of a
   row was edited most recently, so a refresh never wipes what you're typing. */
function merge(serverRows){
 const out={};const now=Date.now();
 serverRows.forEach(v=>{if(!v||!v.id||deleted[v.id])return;const loc=S.rows[v.id];
  const base=Object.assign({company:"",contact:"",stage:"first",last:"",notes:"",steps:{},lastAction:"",channel:""},v);
  out[v.id]=(loc&&((loc.updated||0)>(v.updated||0)||busy[v.id]||loc._t))?loc:base});
 Object.values(S.rows).forEach(loc=>{if(!out[loc.id]&&!deleted[loc.id]&&(busy[loc.id]||loc._t||now-(loc.updated||0)<15000))out[loc.id]=loc});
 return out;
}
function isTyping(){const a=document.activeElement;return !!(a&&a.closest&&a.closest("main")&&(/INPUT|SELECT|TEXTAREA/.test(a.tagName)||(a.classList&&a.classList.contains("hl"))))}
async function pull(){
 try{const data=await api("GET");const before=JSON.stringify(S.rows,(k,v)=>k==="_t"?undefined:v);S.rows=merge(data.rows||[]);
  if(JSON.stringify(S.rows,(k,v)=>k==="_t"?undefined:v)!==before){const rt=route();if(rt==="tracker"||rt.startsWith("s-")){if(isTyping()){S.pend=true}else render()}}
  S.offline=false;
 }catch(e){if(e.message!=="unauthorized"&&!S.offline){S.offline=true;toast("Can’t reach the tracker right now. Retrying…")}}
}
/* ---------- Password screen ---------- */
function showLogin(err){
 let o=document.getElementById("login");
 if(!o){o=document.createElement("div");o.id="login";document.body.appendChild(o)}
 o.innerHTML='<form class="band c-teal" id="loginform" style="max-width:460px;width:100%"><div class="eyebrow">Girls for Gender Equity · team only</div><h1 style="font-size:40px">GGE Outreach Guide</h1><div class="lead">Enter the team password to open the guide and the shared tracker.</div><div style="display:flex;gap:8px;margin-top:18px;flex-wrap:wrap"><input type="password" id="pw" placeholder="Team password" autocomplete="current-password" style="flex:1;min-width:180px;border:1px solid var(--line);border-radius:10px;padding:10px 12px" required><button class="btn" type="submit">Open</button></div>'+(err?'<p style="color:#9A2F21;font-weight:600;margin:12px 0 0">'+esc(err)+'</p>':'')+'</form>';
 o.style.cssText="position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;padding:20px;z-index:100";
 setTimeout(()=>{const i=document.getElementById("pw");if(i)i.focus()},30);
}
document.addEventListener("submit",async e=>{if(e.target.id!=="loginform")return;e.preventDefault();
 PW=document.getElementById("pw").value;
 try{const data=await api("GET");ls.set("gge.pw",PW);S.rows=merge(data.rows||[]);const o=document.getElementById("login");if(o)o.remove();render();startPolling();toast("Welcome in")}
 catch(err){if(err.message!=="unauthorized")showLogin(/^(Failed to fetch|Load failed|NetworkError)/.test(err.message)?"Couldn’t reach the server. Check your internet connection.":err.message)}
});
let polling=null;
function startPolling(){if(polling)return;polling=setInterval(()=>{if(document.visibilityState==="visible")pull()},10000);document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")pull()})}
async function boot(){
 render();
 if(location.protocol==="file:"){S.mode="local";S.rows=ls.get("gge.rows",{});render();return} // opened straight from disk: no server, save in this browser
 S.mode="shared";
 if(!PW){showLogin();return}
 try{const data=await api("GET");S.rows=merge(data.rows||[]);render();startPolling()}
 catch(e){if(e.message!=="unauthorized"){S.mode="shared";toast("Can’t reach the tracker right now. Retrying…");startPolling()}}
}
document.addEventListener("focusout",()=>setTimeout(()=>{const a=document.activeElement;if(S.pend&&!(a&&a.closest&&a.closest("main")&&(/INPUT|SELECT|TEXTAREA/.test(a.tagName)||a.classList.contains("hl")))){S.pend=false;render()}},60));
boot();
</script>
